[package]
name = "supertools"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Agent-native harnesses for existing developer tools: bounded search, trustworthy repository state, project-authoritative verification, and tool discovery with machine-readable evidence."
repository = "https://github.com/matthewjameswatkins1978-cyber/supertools"
keywords = ["cli", "agent", "search", "git", "verification"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
which = "7"
toml = "0.8"
# Sartorial, pinned to the merged v0.2 commit (presentation only; no default
# features — Supertools owns its CLI surface and needs only presentation types).
sartorial = { git = "https://github.com/matthewjameswatkins1978-cyber/Sartorial", rev = "2cfbcd16e7c1c90b27310009fddd49101b904331", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
